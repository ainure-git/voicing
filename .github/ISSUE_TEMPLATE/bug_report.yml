name: "🐛 Bug report"
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select text in the terminal
        2. Right-click → Voicing: Read selection
        3. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor & version
      placeholder: "Cursor 3.13.25 / VS Code 1.128.0 / Windsurf ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Voicing version
      placeholder: "0.1.3"
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics (optional)
      description: Enable `voicing.debugLogging`, reproduce, then paste the "Voicing" Output channel. It never contains the text being read.
      render: text
